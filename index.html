<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雞棚指數 - 海南雞評分</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); } 
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; width: 100%; max-width: 1000px; }
        
        /* 控制面板設計 */
        .controls { background: #2a2a2a; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        .control-group { margin-bottom: 15px; }
        label { display: inline-block; width: 90px; font-weight: bold; font-size: 15px; color: #ddd;}
        input[type=range] { width: 130px; cursor: pointer; accent-color: #FFD700; }
        span { display: inline-block; width: 35px; text-align: right; color: #FFD700; font-weight: bold; font-size: 16px;}
        input[type=text] { padding: 10px; width: 100%; margin-bottom: 15px; font-size: 16px; text-align: center; border-radius: 6px; border: 1px solid #555; background: #111; color: #fff; font-weight: bold; box-sizing: border-box;}
        
        /* 調色盤區域 */
        .color-picker-box { display: flex; justify-content: space-between; background: #1a1a1a; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; }
        .color-item { display: flex; align-items: center; gap: 8px; }
        .color-item label { width: auto; font-size: 14px; margin: 0; }
        input[type="color"] { border: none; width: 30px; height: 30px; cursor: pointer; background: transparent; padding: 0; }

        /* 按鈕設計 */
        .btn { margin-top: 10px; padding: 12px 20px; color: #000; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 6px; width: 100%; transition: 0.3s; }
        .btn-reset { background: #ccc; }
        .btn-reset:hover { background: #aaa; }
        .btn-download { background: #00E676; margin-top: 10px; font-size: 18px; box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);}
        .btn-download:hover { background: #00C853; }
        .note { font-size: 12px; color: #888; margin-top: 15px; text-align: center; }

        /* 圖表顯示區 - 修正為 1:1 比例，防止手機截圖出現過大行距 */
        .chart-box { 
            background: #1a1a1a; 
            background-image: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 500px; 
            aspect-ratio: 1 / 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: 2px dashed #444;
            box-sizing: border-box;
        }
        
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <h2>🐔 雞棚指數 雷達圖生成器</h2>
    <div class="container">
        <div class="controls">
            <input type="text" id="restaurantName" value="店名：大埔XXXX" oninput="updateChart()">
            
            <div class="color-picker-box">
                <div class="color-item">
                    <label>主體顏色</label>
                    <input type="color" id="radarColor" value="#FFD700" oninput="updateColors()">
                </div>
                <div class="color-item">
                    <label>文字顏色</label>
                    <input type="color" id="textColor" value="#ffffff" oninput="updateColors()">
                </div>
            </div>
            
            <div id="sliders"></div>

            <button class="btn btn-download" onclick="downloadChart()">Download</button>
            <button class="btn btn-reset" onclick="resetData()">Reset</button>
            <p class="note">下載後的圖片為 PNG 透明背景，方便貼在 IG 相片上</p>
        </div>

        <div class="chart-box">
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <script>
        const dimensions = [
            { id: 'skin', label: '雞皮', default: 8 },
            { id: 'meat', label: '肉質', default: 8 },
            { id: 'fat', label: '脂肪', default: 6 },
            { id: 'flavor', label: '食味', default: 7 },
            { id: 'rice', label: '油飯', default: 9 },
            { id: 'soy', label: '醬油', default: 7 },
            { id: 'ginger', label: '薑蓉', default: 8 },
            { id: 'chili', label: '辣醬', default: 7 }
        ];

        const slidersContainer = document.getElementById('sliders');
        dimensions.forEach(dim => {
            const div = document.createElement('div');
            div.className = 'control-group';
            div.innerHTML = `
                <label>${dim.label}</label>
                <input type="range" id="${dim.id}" min="0" max="10" value="${dim.default}" oninput="updateChart()">
                <span id="val-${dim.id}">${dim.default}</span>
            `;
            slidersContainer.appendChild(div);
        });

        const ctx = document.getElementById('radarChart').getContext('2d');
        Chart.defaults.backgroundColor = 'transparent';

        let radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: dimensions.map(d => d.label),
                datasets: [{
                    label: '雞棚指數',
                    data: dimensions.map(d => d.default),
                    backgroundColor: '#FFD70073', 
                    borderColor: '#FFD700',       
                    borderWidth: 3,                            
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#FFD700',
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true, // 鎖定比例，防止變形拉長
                plugins: {
                    title: {
                        display: true,
                        text: '店名：大埔XXXX',
                        font: { size: 28, family: 'Microsoft JhengHei', weight: 'bold' },
                        color: '#ffffff',
                        padding: { top: 0, bottom: 10 } // 精確控制行距
                    },
                    legend: { display: false }
                },
                scales: {
                    r: {
                        angleLines: { color: '#ffffff40' }, 
                        grid: { color: '#ffffff40' },       
                        pointLabels: {
                            font: { size: 17, weight: 'bold', family: 'Microsoft JhengHei' }, 
                            color: '#ffffff' 
                        },
                        suggestedMin: 0,
                        suggestedMax: 10,
                        ticks: { stepSize: 2, display: false } 
                    }
                }
            }
        });

        function updateColors() {
            const rColor = document.getElementById('radarColor').value;
            const tColor = document.getElementById('textColor').value;

            radarChart.data.datasets[0].borderColor = rColor;
            radarChart.data.datasets[0].backgroundColor = rColor + '73'; 
            radarChart.data.datasets[0].pointBorderColor = rColor;

            radarChart.options.plugins.title.color = tColor;
            radarChart.options.scales.r.pointLabels.color = tColor;
            radarChart.options.scales.r.angleLines.color = tColor + '40';
            radarChart.options.scales.r.grid.color = tColor + '40';

            document.querySelectorAll('.control-group span').forEach(el => {
                el.style.color = rColor;
            });
            document.querySelectorAll('.control-group input[type="range"]').forEach(el => {
                el.style.accentColor = rColor;
            });

            radarChart.update();
        }

        function updateChart() {
            const newData = dimensions.map(dim => {
                const val = document.getElementById(dim.id).value;
                document.getElementById(`val-${dim.id}`).innerText = val;
                return val;
            });
            const name = document.getElementById('restaurantName').value;
            radarChart.options.plugins.title.text = name;
            radarChart.data.datasets[0].data = newData;
            radarChart.update();
        }

        function resetData() {
            dimensions.forEach(dim => {
                document.getElementById(dim.id).value = 5;
                document.getElementById(`val-${dim.id}`).innerText = 5;
            });
            document.getElementById('restaurantName').value = "店名：大埔XXXX";
            
            document.getElementById('radarColor').value = "#FFD700";
            document.getElementById('textColor').value = "#ffffff";
            updateColors();
            updateChart();
        }

        function downloadChart() {
            const link = document.createElement('a');
            link.download = '雞棚指數.png';
            link.href = radarChart.canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
