<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雞棚指數 - 海南雞評分</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); } 
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; width: 100%; max-width: 1000px; }
        
        /* 控制面板設計 */
        .controls { background: #2a2a2a; padding: 25px; border-radius: 12px; min-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .control-group { margin-bottom: 15px; }
        label { display: inline-block; width: 100px; font-weight: bold; font-size: 15px; color: #ddd;}
        input[type=range] { width: 140px; cursor: pointer; accent-color: #FFD700; }
        span { display: inline-block; width: 35px; text-align: right; color: #FFD700; font-weight: bold; font-size: 16px;}
        input[type=text] { padding: 10px; width: 100%; margin-bottom: 20px; font-size: 16px; text-align: center; border-radius: 6px; border: 1px solid #555; background: #111; color: #FFD700; font-weight: bold;}
        
        /* 按鈕設計 */
        .btn { margin-top: 10px; padding: 12px 20px; color: #000; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 6px; width: 100%; transition: 0.3s; }
        .btn-reset { background: #ccc; }
        .btn-reset:hover { background: #aaa; }
        .btn-download { background: #00E676; margin-top: 20px; font-size: 18px; box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);}
        .btn-download:hover { background: #00C853; }
        .note { font-size: 12px; color: #888; margin-top: 15px; text-align: center; }

        /* 圖表顯示區 - 模擬深色背景以便預覽白色字體 */
        .chart-box { 
            background: #1a1a1a; 
            background-image: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 20px 20px;
            padding: 20px; 
            border-radius: 12px; 
            width: 500px; 
            height: 500px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: 2px dashed #444;
        }
    </style>
</head>
<body>
    <h2>🐔 雞棚指數 雷達圖生成器</h2>
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <input type="text" id="restaurantName" value="店名：大埔XXXX" oninput="updateChart()">
            </div>
            
            <div id="sliders"></div>

            <button class="btn btn-download" onclick="downloadChart()">Download</button>
            <button class="btn btn-reset" onclick="resetData()">重置數據</button>
            <p class="note">下載後的圖片為 PNG 透明背景，方便貼在 IG 相片上</p>
        </div>

        <div class="chart-box">
            <!-- Canvas 本身係透明，CSS 背景只係用作預覽 -->
            <canvas id="radarChart"></canvas>
        </div>
    </div>

    <script>
        // 設定 8 個海南雞評測維度
        const dimensions = [
            { id: 'skin', label: '雞皮', default: 8 },
            { id: 'meat', label: '肉質', default: 8 },
            { id: 'fat', label: '脂肪', default: 6 },
            { id: 'flavor', label: '雞味', default: 7 },
            { id: 'rice', label: '油飯', default: 9 },
            { id: 'soy', label: '醬油', default: 7 },
            { id: 'ginger', label: '薑蓉', default: 8 },
            { id: 'chili', label: '辣醬', default: 7 }
        ];

        // 動態生成滑桿
        const slidersContainer = document.getElementById('sliders');
        dimensions.forEach(dim => {
            const div = document.createElement('div');
            div.className = 'control-group';
            div.innerHTML = `
                <label>${dim.label}</label>
                <input type="range" id="${dim.id}" min="0" max="10" value="${dim.default}" oninput="updateChart()">
                <span id="val-${dim.id}">${dim.default}</span>
            `;
            slidersContainer.appendChild(div);
        });

        // 初始化圖表
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        // 確保 Chart 背景全透明
        Chart.defaults.backgroundColor = 'transparent';

        let radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: dimensions.map(d => d.label),
                datasets: [{
                    label: '雞棚指數',
                    data: dimensions.map(d => d.default),
                    backgroundColor: 'rgba(255, 215, 0, 0.45)', // 亮金黃色填充
                    borderColor: 'rgba(255, 215, 0, 1)',       // 亮金黃色實線邊框
                    borderWidth: 3,                            // 加粗邊框
                    pointBackgroundColor: '#fff',
                    pointBorderColor: '#FFD700',
                    pointRadius: 4,
                    pointHoverRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: '店名：大埔XXXX',
                        font: { size: 28, family: 'Microsoft JhengHei', weight: 'bold' },
                        color: '#ffffff', // 標題轉白色
                        padding: { bottom: 20 }
                    },
                    legend: { display: false }
                },
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255, 255, 255, 0.25)' }, // 雷達放射線（半透明白）
                        grid: { color: 'rgba(255, 255, 255, 0.25)' },       // 雷達網格線（半透明白）
                        pointLabels: {
                            font: { size: 17, weight: 'bold', family: 'Microsoft JhengHei' }, // 放大字體方便手機睇
                            color: '#ffffff' // 維度文字全部轉純白色
                        },
                        suggestedMin: 0,
                        suggestedMax: 10,
                        ticks: { stepSize: 2, display: false } 
                    }
                }
            }
        });

        // 更新圖表函數
        function updateChart() {
            const newData = dimensions.map(dim => {
                const val = document.getElementById(dim.id).value;
                document.getElementById(`val-${dim.id}`).innerText = val;
                return val;
            });
            const name = document.getElementById('restaurantName').value;
            radarChart.options.plugins.title.text = name;
            radarChart.data.datasets[0].data = newData;
            radarChart.update();
        }

        // 重置函數
        function resetData() {
            dimensions.forEach(dim => {
                document.getElementById(dim.id).value = 5;
                document.getElementById(`val-${dim.id}`).innerText = 5;
            });
            document.getElementById('restaurantName').value = "店名：大埔XXXX";
            updateChart();
        }

        // 圖片下載函數 (匯出透明 PNG)
        function downloadChart() {
            const link = document.createElement('a');
            link.download = '雞棚指數.png';
            link.href = radarChart.canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
